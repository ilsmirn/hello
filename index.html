<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, #1e2a5a 0%, #0b1026 70%);
      color: #fff;
    }

    .greeting {
      font-size: clamp(2.5rem, 9vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-align: center;
      background: linear-gradient(90deg, #ff6ec4, #f9d423, #4ade80, #60a5fa, #ff6ec4);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(96, 165, 250, 0.45));
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1 class="greeting">Hello World</h1>
  <p class="subtitle">welcome to my page</p>
</body>
</html>
